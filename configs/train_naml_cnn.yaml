data:
  processed_dir: data/processed/real_data_v1
  text_views: [title, sapo, tags]
  history_len: 50
  num_negatives: 4
  train_batch_size: 32
  eval_batch_size: 128
  num_workers: 4
  max_eval_impressions: null

model:
  name: naml_cnn
  # Chỉ lấy ma trận input embedding của PhoBERT làm word embedding, không chạy transformer.
  pretrained_name: vinai/phobert-base-v2
  freeze_embedding: false
  num_filters: 400
  window_size: 3
  category_dim: 100
  query_dim: 200
  dropout: 0.2

loss:
  name: cross_entropy

optimizer:
  lr: 1.0e-4
  encoder_lr: 1.0e-4

trainer:
  seed: 42
  epochs: 5
  gradient_accumulation_steps: 1
  mixed_precision: bf16
  log_every: 50
  max_train_steps: null
  save_every_steps: 1000
  output_root: outputs
  run_name: naml_cnn_phobert_emb
