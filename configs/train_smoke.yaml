run:
  name: smoke
  output_root: outputs/smoke

data:
  processed_dir: data/processed/real_data_fasttext_v3
  text_views: [title, sapo, tags]
  history_len: 10
  num_negatives: 4
  train_batch_size: 8
  eval_batch_size: 8
  num_workers: 0
  max_train_samples: 64
  max_eval_impressions: 20

model:
  name: naml_popularity
  freeze_embedding: false
  num_filters: 400
  window_size: 3
  category_dim: 100
  query_dim: 200
  dropout: 0.2
  popularity_user_dim: 16
  popularity_hidden_dim: 32

loss:
  name: cross_entropy

optimizer:
  lr: 1.0e-4
  weight_decay: 0.0

scheduler:
  factor: 0.5
  patience: 1
  min_lr: 1.0e-6

early_stopping:
  patience: 1
  min_delta: 1.0e-4

trainer:
  seed: 42
  epochs: 3
  gradient_accumulation_steps: 1
  mixed_precision: "no"
  max_grad_norm: 5.0
  monitor: ndcg@10
  max_train_steps: null
  save_every_steps: null
