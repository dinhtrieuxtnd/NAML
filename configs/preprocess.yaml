run:
  name: real_data_fasttext_v3
  output_root: data/processed
  overwrite: false

input:
  train_behaviors: data/raw/behaviors/train_behaviors.csv
  val_behaviors: data/raw/behaviors/val_behaviors.csv
  test_behaviors: data/raw/behaviors/test_behaviors.csv
  news: data/raw/news/news.csv
  word_vectors: data/raw/fasttext/cc.vi.300.vec
  # Click thật theo clientTime (chỉ đọc, không sửa create_data/).
  click_log: create_data/raw_log_cleaned

embedding:
  dim: 300
  unmatched_init_std: 0.1
  seed: 42

# Độ dài tính theo token (âm tiết / dấu câu); chỉnh theo p95 trong statistics.json.
text:
  max_length:
    title: 32
    sapo: 72
    tags: 32

# Cùng cửa sổ với popularity_window_minutes của configs/baselines.yaml (15 phút tốt nhất trên val).
popularity:
  window_minutes: 15
