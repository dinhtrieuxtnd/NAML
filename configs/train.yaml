run:
  name: naml
  output_root: outputs

data:
  processed_dir: data/processed/real_data_fasttext_v3
  text_views: [title, sapo, tags]
  history_len: 50
  num_negatives: 4
  train_batch_size: 512
  eval_batch_size: 1024
  num_workers: 4
  max_train_samples: null
  max_eval_impressions: null

model:
  name: naml_popularity
  freeze_embedding: true
  num_filters: 400
  window_size: 3
  category_dim: 100
  query_dim: 200
  dropout: 0.2
  popularity_user_dim: 16
  popularity_hidden_dim: 32

loss:
  name: cross_entropy

optimizer:
  lr: 2.0e-4
  weight_decay: 1e-4

scheduler:
  factor: 0.5
  patience: 1
  min_lr: 1.0e-6

early_stopping:
  patience: 3
  min_delta: 1.0e-4

trainer:
  seed: 42
  epochs: 30
  gradient_accumulation_steps: 1
  mixed_precision: bf16
  max_grad_norm: 5.0
  monitor: ndcg@10
  max_train_steps: null
  save_every_steps: 500
