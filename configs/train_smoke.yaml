run:
  name: smoke
  output_root: outputs/smoke

data:
  processed_dir: data/processed/real_data_fasttext_v1
  text_views: [title, sapo, tags]
  history_len: 10
  num_negatives: 4
  train_batch_size: 2
  eval_batch_size: 8
  num_workers: 0
  max_eval_impressions: 20

model:
  name: naml
  freeze_embedding: false
  num_filters: 400
  window_size: 3
  category_dim: 100
  query_dim: 200
  dropout: 0.2

loss:
  name: cross_entropy

optimizer:
  lr: 1.0e-4
  weight_decay: 0.0

trainer:
  seed: 42
  epochs: 1
  gradient_accumulation_steps: 1
  mixed_precision: "no"
  log_every: 1
  max_train_steps: 5
  save_every_steps: null
