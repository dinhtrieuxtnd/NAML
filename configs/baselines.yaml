run:
  name: baselines
  output_root: outputs

data:
  processed_dir: data/processed/real_data_fasttext_v2
  # Phải là các file đã dùng để tạo processed_dir (xem configs/preprocess.yaml).
  train_behaviors: data/raw/behaviors/train_behaviors.csv
  val_behaviors: data/raw/behaviors/val_behaviors.csv
  test_behaviors: data/raw/behaviors/test_behaviors.csv

seed: 42
# Chọn theo val ndcg@10 (5–60 phút; 15 phút tốt nhất, cửa sổ tính bằng giờ kém hơn hẳn).
popularity_window_minutes: 15
