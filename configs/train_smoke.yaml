data:
  processed_dir: data/processed/real_data_v1
  text_views: [title, sapo, tags]
  history_len: 10
  num_negatives: 4
  train_batch_size: 2
  eval_batch_size: 8
  num_workers: 0
  max_eval_impressions: 20

model:
  name: naml
  pretrained_name: vinai/phobert-base-v2
  num_trainable_layers: 1
  category_dim: 100
  query_dim: 200
  dropout: 0.2

loss:
  name: cross_entropy

optimizer:
  lr: 1.0e-4
  encoder_lr: 2.0e-5

trainer:
  seed: 42
  epochs: 1
  gradient_accumulation_steps: 1
  mixed_precision: "no"
  log_every: 1
  max_train_steps: 5
  checkpoint_total_limit: 1
  output_root: outputs/smoke
  run_name: smoke
